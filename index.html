<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tulis</title>
<style>
  :root{
    --ribbon-bg:#f3f2f1;
    --ribbon-border:#e1dfdd;
    --accent:#2b579a;
    --accent-dark:#204072;
    --btn-hover:#e5e9ee;
    --btn-active:#c7d6ea;
    --text:#252423;
    --page-bg:#ffffff;
    --canvas-bg:#e9eaec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; padding:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas-bg);
    color:var(--text);
    overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  /* Title bar */
  #titlebar{
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    flex-shrink:0;
  }
  #docTitle{
    background:transparent;
    border:none;
    color:#fff;
    font-size:15px;
    font-weight:600;
    outline:none;
    flex:1;
    min-width:0;
    border-bottom:1px solid transparent;
  }
  #docTitle:focus{border-bottom:1px solid rgba(255,255,255,0.6);}
  .titlebar-btn{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    border-radius:4px;
    width:34px;
    height:34px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .titlebar-btn:active{background:rgba(255,255,255,0.3);}

  /* Ribbon */
  #ribbon-tabs{
    display:flex;
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--ribbon-border);
    flex-shrink:0;
    overflow-x:auto;
  }
  .ribbon-tab{
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    color:#444;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .ribbon-tab.active{
    color:var(--accent);
    border-bottom:2px solid var(--accent);
  }

  #ribbon{
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--ribbon-border);
    flex-shrink:0;
    overflow-x:auto;
    white-space:nowrap;
    padding:6px 8px;
  }
  #ribbon::-webkit-scrollbar{display:none;}
  .ribbon-group{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    vertical-align:top;
    padding:2px 8px;
    border-right:1px solid var(--ribbon-border);
  }
  .ribbon-group:last-child{border-right:none;}
  .ribbon-row{display:flex; gap:2px; align-items:center;}
  .ribbon-label{font-size:10px; color:#777; margin-top:3px;}

  .rbtn{
    width:32px; height:32px;
    border:1px solid transparent;
    background:transparent;
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    color:#333;
  }
  .rbtn.wide{width:auto; padding:0 8px; font-size:13px; gap:4px;}
  .rbtn:active{background:var(--btn-active);}
  .rbtn.active{background:var(--btn-active); border-color:#a9c1e0;}
  .rbtn svg{width:17px; height:17px;}

  select.rsel{
    height:32px;
    border:1px solid var(--ribbon-border);
    border-radius:4px;
    background:#fff;
    font-size:13px;
    padding:0 4px;
    color:#333;
  }
  #fontFamily{width:118px;}
  #fontSize{width:54px;}

  input[type=color].colorpick{
    width:32px; height:26px; border:1px solid var(--ribbon-border); border-radius:4px; padding:0; background:#fff;
  }

  /* Canvas / page */
  #canvasWrap{
    flex:1;
    overflow-y:auto;
    padding:18px 10px 60px;
    -webkit-overflow-scrolling:touch;
  }
  #page{
    background:var(--page-bg);
    max-width:800px;
    min-height:1100px;
    margin:0 auto;
    padding:56px 48px;
    box-shadow:0 1px 4px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.2);
    font-size:16px;
    line-height:1.6;
    outline:none;
    color:#1a1a1a;
  }
  #page:empty:before{
    content:attr(data-placeholder);
    color:#a0a0a0;
  }
  #page p{margin:0 0 10px;}

  /* Status bar */
  #statusbar{
    flex-shrink:0;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    padding:4px 12px;
    display:flex;
    justify-content:space-between;
  }

  /* File menu overlay */
  #fileMenu{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:50;
  }
  #fileMenu.open{display:flex;}
  #fileMenuBox{
    background:#fff;
    margin-top:54px;
    width:min(320px, 90vw);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .fileMenuItem{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    font-size:14px;
    border-bottom:1px solid #f0f0f0;
  }
  .fileMenuItem:active{background:#f5f5f5;}
  .fileMenuItem .ico{font-size:18px; width:20px; text-align:center;}
  #toast{
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    background:#323130; color:#fff; padding:9px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:60; max-width:85vw; text-align:center;
  }
  #toast.show{opacity:1;}

  #fileInput{display:none;}
</style>
</head>
<body>
<div id="app">

  <div id="titlebar">
    <button class="titlebar-btn" id="menuBtn" title="Menu">&#9776;</button>
    <input id="docTitle" value="Dokumen Tanpa Judul" spellcheck="false">
    <button class="titlebar-btn" id="saveBtn" title="Simpan">&#128190;</button>
  </div>

  <div id="ribbon-tabs">
    <div class="ribbon-tab active">Beranda</div>
    <div class="ribbon-tab" id="tabInsert">Sisipkan</div>
    <div class="ribbon-tab" id="tabLayout">Tata Letak</div>
  </div>

  <div id="ribbon">
    <div id="ribbonHome">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="undo" title="Urungkan">&#8630;</button>
          <button class="rbtn" data-cmd="redo" title="Ulangi">&#8631;</button>
        </span>
        <span class="ribbon-label">Urungkan</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <select class="rsel" id="fontFamily">
            <option value="Calibri, sans-serif">Calibri</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Verdana, sans-serif">Verdana</option>
          </select>
          <select class="rsel" id="fontSize">
            <option>8</option><option>9</option><option>10</option><option>11</option>
            <option selected>12</option><option>14</option><option>16</option><option>18</option>
            <option>20</option><option>24</option><option>28</option><option>32</option><option>36</option>
          </select>
        </span>
        <span class="ribbon-label">Font</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="bold" title="Tebal" style="font-weight:700;">B</button>
          <button class="rbtn" data-cmd="italic" title="Miring" style="font-style:italic;">I</button>
          <button class="rbtn" data-cmd="underline" title="Garis Bawah" style="text-decoration:underline;">U</button>
          <button class="rbtn" data-cmd="strikeThrough" title="Coret" style="text-decoration:line-through;">S</button>
        </span>
        <span class="ribbon-row" style="margin-top:2px;">
          <input type="color" class="colorpick" id="textColor" title="Warna Teks" value="#1a1a1a">
          <input type="color" class="colorpick" id="highlightColor" title="Sorot" value="#ffff00">
        </span>
        <span class="ribbon-label">Font</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="justifyLeft" title="Rata Kiri">&#8676;</button>
          <button class="rbtn" data-cmd="justifyCenter" title="Rata Tengah">&#8596;</button>
          <button class="rbtn" data-cmd="justifyRight" title="Rata Kanan">&#8677;</button>
          <button class="rbtn" data-cmd="justifyFull" title="Rata Kanan-Kiri">&#9776;</button>
        </span>
        <span class="ribbon-row" style="margin-top:2px;">
          <button class="rbtn" data-cmd="insertUnorderedList" title="Poin">&#8226;&#8226;&#8226;</button>
          <button class="rbtn" data-cmd="insertOrderedList" title="Penomoran">1.2.3.</button>
          <button class="rbtn" data-cmd="indent" title="Naikkan Indentasi">&#8677;&#8677;</button>
          <button class="rbtn" data-cmd="outdent" title="Turunkan Indentasi">&#8676;&#8676;</button>
        </span>
        <span class="ribbon-label">Paragraf</span>
      </span>
    </div>

    <div id="ribbonInsert" style="display:none;">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn wide" id="insertTableBtn">&#9638; Tabel</button>
          <button class="rbtn wide" id="insertLinkBtn">&#128279; Tautan</button>
          <button class="rbtn wide" id="insertHrBtn">&#8213; Garis</button>
        </span>
        <span class="ribbon-label">Sisipkan</span>
      </span>
    </div>

    <div id="ribbonLayout" style="display:none;">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <select class="rsel" id="lineSpacing">
            <option value="1">1.0</option>
            <option value="1.15" selected>1.15</option>
            <option value="1.5">1.5</option>
            <option value="2">2.0</option>
          </select>
        </span>
        <span class="ribbon-label">Spasi Baris</span>
      </span>
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn wide" id="clearFormatBtn">Hapus Format</button>
        </span>
        <span class="ribbon-label">Format</span>
      </span>
    </div>
  </div>

  <div id="canvasWrap">
    <div id="page" contenteditable="true" data-placeholder="Mulai menulis di sini..." spellcheck="true"></div>
  </div>

  <div id="statusbar">
    <span id="wordCount">0 kata</span>
    <span id="saveStatus">Belum disimpan</span>
  </div>
</div>

<div id="fileMenu">
  <div id="fileMenuBox">
    <div class="fileMenuItem" id="newDocItem"><span class="ico">&#128196;</span> Dokumen Baru</div>
    <div class="fileMenuItem" id="openDocItem"><span class="ico">&#128193;</span> Buka...</div>
    <div class="fileMenuItem" id="saveDocItem"><span class="ico">&#128190;</span> Simpan</div>
    <div class="fileMenuItem" id="exportTxtItem"><span class="ico">&#128441;&#65039;</span> Ekspor sebagai .txt</div>
  </div>
</div>

<input type="file" id="fileInput" accept=".doc,.html,.txt">
<div id="toast"></div>

<script>
(function(){
  const page = document.getElementById('page');
  const docTitle = document.getElementById('docTitle');
  const wordCount = document.getElementById('wordCount');
  const saveStatus = document.getElementById('saveStatus');
  const toastEl = document.getElementById('toast');
  const fileMenu = document.getElementById('fileMenu');
  const fileInput = document.getElementById('fileInput');

  const STORAGE_DIR = ''; // root of app's data dir
  let currentFileName = 'dokumen-tanpa-judul.doc';
  let dirty = false;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2000);
  }

  function isCapacitor(){
    return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem);
  }

  function markDirty(){
    dirty = true;
    saveStatus.textContent = 'Belum disimpan';
  }

  function updateWordCount(){
    const text = page.innerText.trim();
    const words = text.length ? text.split(/\s+/).length : 0;
    wordCount.textContent = words + ' kata';
  }

  // ---------- Toolbar formatting ----------
  document.querySelectorAll('.rbtn[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      page.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      markDirty();
      refreshActiveStates();
    });
  });

  document.getElementById('fontFamily').addEventListener('change', e=>{
    page.focus();
    document.execCommand('fontName', false, e.target.value);
    markDirty();
  });
  document.getElementById('fontSize').addEventListener('change', e=>{
    page.focus();
    // execCommand fontSize only supports 1-7, so wrap manually
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('fontSize', false, '7');
    document.querySelectorAll('font[size="7"]').forEach(el=>{
      el.removeAttribute('size');
      el.style.fontSize = e.target.value + 'pt';
    });
    markDirty();
  });
  document.getElementById('textColor').addEventListener('input', e=>{
    page.focus();
    document.execCommand('foreColor', false, e.target.value);
    markDirty();
  });
  document.getElementById('highlightColor').addEventListener('input', e=>{
    page.focus();
    document.execCommand('hiliteColor', false, e.target.value);
    markDirty();
  });
  document.getElementById('lineSpacing').addEventListener('change', e=>{
    page.style.lineHeight = e.target.value;
    markDirty();
  });
  document.getElementById('clearFormatBtn').addEventListener('click', ()=>{
    page.focus();
    document.execCommand('removeFormat', false, null);
    markDirty();
  });
  document.getElementById('insertHrBtn').addEventListener('click', ()=>{
    page.focus();
    document.execCommand('insertHorizontalRule', false, null);
    markDirty();
  });
  document.getElementById('insertLinkBtn').addEventListener('click', ()=>{
    const url = prompt('Masukkan URL tautan:');
    if(url){
      page.focus();
      document.execCommand('createLink', false, url);
      markDirty();
    }
  });
  document.getElementById('insertTableBtn').addEventListener('click', ()=>{
    const rows = parseInt(prompt('Jumlah baris:', '2')) || 2;
    const cols = parseInt(prompt('Jumlah kolom:', '2')) || 2;
    let html = '<table style="border-collapse:collapse;width:100%;margin:8px 0;">';
    for(let r=0;r<rows;r++){
      html += '<tr>';
      for(let c=0;c<cols;c++){
        html += '<td style="border:1px solid #999;padding:6px;min-width:40px;">&nbsp;</td>';
      }
      html += '</tr>';
    }
    html += '</table><p><br></p>';
    page.focus();
    document.execCommand('insertHTML', false, html);
    markDirty();
  });

  function refreshActiveStates(){
    document.querySelectorAll('.rbtn[data-cmd]').forEach(btn=>{
      try{
        const state = document.queryCommandState(btn.dataset.cmd);
        btn.classList.toggle('active', !!state);
      }catch(e){}
    });
  }
  page.addEventListener('keyup', refreshActiveStates);
  page.addEventListener('mouseup', refreshActiveStates);
  page.addEventListener('input', ()=>{ updateWordCount(); markDirty(); });

  // ---------- Ribbon tabs ----------
  const tabs = document.querySelectorAll('.ribbon-tab');
  const panels = {
    0: document.getElementById('ribbonHome'),
    1: document.getElementById('ribbonInsert'),
    2: document.getElementById('ribbonLayout')
  };
  tabs.forEach((tab, idx)=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(panels).forEach(p=>p.style.display='none');
      panels[idx].style.display='block';
    });
  });

  // ---------- File menu ----------
  document.getElementById('menuBtn').addEventListener('click', ()=> fileMenu.classList.add('open'));
  fileMenu.addEventListener('click', (e)=>{ if(e.target===fileMenu) fileMenu.classList.remove('open'); });

  document.getElementById('newDocItem').addEventListener('click', ()=>{
    fileMenu.classList.remove('open');
    if(dirty && !confirm('Dokumen belum disimpan. Buat dokumen baru dan buang perubahan?')) return;
    page.innerHTML = '';
    docTitle.value = 'Dokumen Tanpa Judul';
    currentFileName = 'dokumen-tanpa-judul.doc';
    dirty = false;
    saveStatus.textContent = 'Belum disimpan';
    updateWordCount();
  });

  document.getElementById('saveDocItem').addEventListener('click', ()=>{ fileMenu.classList.remove('open'); saveDocument(); });
  document.getElementById('saveBtn').addEventListener('click', saveDocument);

  document.getElementById('exportTxtItem').addEventListener('click', async ()=>{
    fileMenu.classList.remove('open');
    const text = page.innerText;
    const name = (docTitle.value || 'dokumen').replace(/[\\/:*?"<>|]/g,'_') + '.txt';
    if(isCapacitor()){
      try{
        await window.Capacitor.Plugins.Filesystem.writeFile({
          path: name, data: text,
          directory: 'DOCUMENTS', encoding: 'utf8'
        });
        toast('Diekspor ke Documents: ' + name);
      }catch(err){ toast('Gagal ekspor: ' + err.message); }
    } else {
      downloadBlob(new Blob([text], {type:'text/plain'}), name);
    }
  });

  document.getElementById('openDocItem').addEventListener('click', ()=>{
    fileMenu.classList.remove('open');
    if(isCapacitor()){
      openFromAppStorage();
    } else {
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      loadContent(reader.result, f.name);
    };
    reader.readAsText(f);
    fileInput.value = '';
  });

  function loadContent(content, name){
    page.innerHTML = content;
    docTitle.value = name.replace(/\.(doc|html|txt)$/i,'');
    currentFileName = name;
    dirty = false;
    saveStatus.textContent = 'Tersimpan';
    updateWordCount();
  }

  async function saveDocument(){
    const name = (docTitle.value || 'dokumen').trim().replace(/[\\/:*?"<>|]/g,'_') + '.doc';
    currentFileName = name;
    const content = page.innerHTML;
    if(isCapacitor()){
      try{
        await window.Capacitor.Plugins.Filesystem.writeFile({
          path: name, data: content,
          directory: 'DOCUMENTS', encoding: 'utf8'
        });
        dirty = false;
        saveStatus.textContent = 'Tersimpan';
        toast('Dokumen disimpan: ' + name);
      }catch(err){
        toast('Gagal menyimpan: ' + err.message);
      }
    } else {
      // Browser fallback: local download as .doc (Word-openable HTML)
      const html = '<html><head><meta charset="utf-8"></head><body>' + content + '</body></html>';
      downloadBlob(new Blob([html], {type:'application/msword'}), name);
      dirty = false;
      saveStatus.textContent = 'Tersimpan (diunduh)';
    }
  }

  async function openFromAppStorage(){
    try{
      const res = await window.Capacitor.Plugins.Filesystem.readdir({
        path: '', directory: 'DOCUMENTS'
      });
      const docs = (res.files || []).filter(f=>{
        const n = f.name || f;
        return /\.(doc|html|txt)$/i.test(n);
      });
      if(!docs.length){ toast('Belum ada dokumen tersimpan'); return; }
      const names = docs.map(f=> f.name || f);
      const choice = prompt('Buka dokumen:\n' + names.map((n,i)=>(i+1)+'. '+n).join('\n') + '\n\nMasukkan nomor:');
      const idx = parseInt(choice) - 1;
      if(idx < 0 || idx >= names.length) return;
      const fileRes = await window.Capacitor.Plugins.Filesystem.readFile({
        path: names[idx], directory: 'DOCUMENTS', encoding: 'utf8'
      });
      loadContent(fileRes.data, names[idx]);
      toast('Dibuka: ' + names[idx]);
    }catch(err){
      toast('Gagal membuka: ' + err.message);
    }
  }

  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  docTitle.addEventListener('input', markDirty);

  // ---------- Auto-save to localStorage as backup ----------
  const AUTOSAVE_KEY = 'wordapp_autosave';
  function autoSave(){
    try{
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
        title: docTitle.value,
        content: page.innerHTML,
        ts: Date.now()
      }));
    }catch(e){}
  }
  setInterval(autoSave, 15000);

  function restoreAutoSave(){
    try{
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      if(data.content && data.content.trim()){
        page.innerHTML = data.content;
        docTitle.value = data.title || docTitle.value;
        updateWordCount();
      }
    }catch(e){}
  }
  restoreAutoSave();

  // Prevent accidental navigation loss
  window.addEventListener('beforeunload', (e)=>{
    if(dirty){ e.preventDefault(); e.returnValue=''; }
  });

  updateWordCount();
})();
</script>
</body>
</html>
