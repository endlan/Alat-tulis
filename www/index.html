<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tulis</title>
<style>
  :root{
    --ribbon-bg:#f3f2f1;
    --ribbon-border:#e1dfdd;
    --accent:#2b579a;
    --accent-dark:#204072;
    --btn-hover:#e5e9ee;
    --btn-active:#c7d6ea;
    --text:#252423;
    --page-bg:#ffffff;
    --canvas-bg:#e9eaec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; padding:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas-bg);
    color:var(--text);
    overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  /* Title bar */
  #titlebar{
    background:var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    flex-shrink:0;
  }
  #docTitle{
    background:transparent;
    border:none;
    color:#fff;
    font-size:15px;
    font-weight:600;
    outline:none;
    flex:1;
    min-width:0;
    border-bottom:1px solid transparent;
  }
  #docTitle:focus{border-bottom:1px solid rgba(255,255,255,0.6);}
  .titlebar-btn{
    background:rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    border-radius:4px;
    width:34px;
    height:34px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .titlebar-btn:active{background:rgba(255,255,255,0.3);}

  /* Ribbon */
  #ribbon-tabs{
    display:flex;
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--ribbon-border);
    flex-shrink:0;
    overflow-x:auto;
  }
  .ribbon-tab{
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    color:#444;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .ribbon-tab.active{
    color:var(--accent);
    border-bottom:2px solid var(--accent);
  }

  #ribbon{
    background:var(--ribbon-bg);
    border-bottom:1px solid var(--ribbon-border);
    flex-shrink:0;
    overflow-x:auto;
    white-space:nowrap;
    padding:6px 8px;
  }
  #ribbon::-webkit-scrollbar{display:none;}
  .ribbon-group{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    vertical-align:top;
    padding:2px 8px;
    border-right:1px solid var(--ribbon-border);
  }
  .ribbon-group:last-child{border-right:none;}
  .ribbon-row{display:flex; gap:2px; align-items:center;}
  .ribbon-label{font-size:10px; color:#777; margin-top:3px;}

  .rbtn{
    width:32px; height:32px;
    border:1px solid transparent;
    background:transparent;
    border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    color:#333;
  }
  .rbtn.wide{width:auto; padding:0 8px; font-size:13px; gap:4px;}
  .rbtn:active{background:var(--btn-active);}
  .rbtn.active{background:var(--btn-active); border-color:#a9c1e0;}
  .rbtn svg{width:17px; height:17px;}

  select.rsel{
    height:32px;
    border:1px solid var(--ribbon-border);
    border-radius:4px;
    background:#fff;
    font-size:13px;
    padding:0 4px;
    color:#333;
  }
  #fontFamily{width:118px;}
  #fontSize{width:54px;}

  input[type=color].colorpick{
    width:32px; height:26px; border:1px solid var(--ribbon-border); border-radius:4px; padding:0; background:#fff;
  }

  /* Canvas / page */
  #canvasWrap{
    flex:1;
    overflow-x:auto;
    overflow-y:auto;
    padding:0 10px;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x pan-y;
  }
  #canvasInner{
    padding-top:4px;
    width:max-content;
    margin:0 auto;
  }
  #zoomStage{
    /* 'zoom' (Chromium/WebView) genuinely rescales layout, unlike
       transform:scale(), so sticky rulers & scrolling stay correct.
       This app targets Android WebView (Chromium), where it's supported. */
    width:max-content;
  }
  #docGrid{
    display:grid;
    grid-template-columns:22px max-content;
    grid-template-rows:22px max-content 60px;
  }
  #cornerBox{
    grid-column:1; grid-row:1;
    position:sticky; top:0; left:0; z-index:7;
    width:22px; height:22px;
    background:#fbfbfb;
    border-right:1px solid #d4d4d4;
    border-bottom:1px solid #d4d4d4;
  }
  #rulerWrap{
    grid-column:2; grid-row:1;
    position:sticky;
    top:0;
    z-index:5;
    height:22px;
    background:#fbfbfb;
    border-bottom:1px solid #d4d4d4;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  #vRulerWrap{
    grid-column:1; grid-row:2 / span 2;
    align-self:start;
    position:sticky;
    left:0;
    top:22px;
    z-index:5;
    width:22px;
    overflow:hidden;
    background:#fbfbfb;
    border-right:1px solid #d4d4d4;
    box-shadow:1px 0 2px rgba(0,0,0,0.06);
  }
  #pageCell{
    grid-column:2; grid-row:2;
    position:relative;
  }
  /* Penanda batas halaman di editor (tidak ikut tersimpan/tercetak) */
  #pbLayer{
    position:absolute; top:0; left:0; right:0; bottom:0;
    pointer-events:none; z-index:1; /* di bawah penggaris (z-index 5) saat digeser/zoom */
  }
  .pb-gap{
    position:absolute; left:0; right:-12px;
    background:var(--canvas-bg);
    box-shadow:inset 0 3px 4px -3px rgba(0,0,0,0.25), inset 0 -3px 4px -3px rgba(0,0,0,0.25);
  }
  .pb-gap span{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font:600 10px Arial,sans-serif; color:#666;
  }
  #page [data-pgm]{padding-top:var(--pgm);}
  .pgsp{display:inline-block; width:0; vertical-align:bottom; pointer-events:none;}
  .ruler-margin{
    position:absolute;
    top:0; bottom:0;
    background:#d9d9d9;
  }
  #vRulerInner{
    position:absolute; left:0; right:0; top:0;
  }
  .ruler-margin-v{
    position:absolute;
    left:0; right:0;
    background:#d9d9d9;
  }
  .ruler-tick{
    position:absolute;
    bottom:0;
    width:1px;
    background:#999;
  }
  .ruler-tick.major{height:9px; background:#777;}
  .ruler-tick.minor{height:5px;}
  .ruler-gap-v{position:absolute; left:0; right:0; background:var(--canvas-bg);}
  .ruler-tick-v{
    position:absolute;
    right:0;
    height:1px;
    background:#999;
  }
  .ruler-tick-v.major{width:9px; background:#777;}
  .ruler-tick-v.minor{width:5px;}
  .ruler-num{
    position:absolute;
    top:1px;
    font-size:9px;
    color:#555;
    transform:translateX(-50%);
    font-family:Arial,sans-serif;
  }
  .ruler-num-v{
    position:absolute;
    left:1px;
    font-size:9px;
    color:#555;
    transform:translateY(-50%);
    font-family:Arial,sans-serif;
    writing-mode:vertical-rl;
  }
  #page{
    position:relative;
    background:var(--page-bg);
    max-width:800px;
    min-height:1100px;
    padding:56px 48px;
    box-shadow:0 1px 4px rgba(0,0,0,0.15), 0 0 1px rgba(0,0,0,0.2);
    outline:none;
  }
  /* Gaya isi dokumen dipakai bersama oleh editor dan pratinjau cetak */
  #page, .doc-content{
    font-size:16px;
    line-height:1.6;
    color:#1a1a1a;
    overflow-wrap:anywhere;
  }
  #page p, .doc-content p{margin:0 0 10px;}
  #page img, .doc-content img{max-width:100%; height:auto;}
  #page table, .doc-content table{max-width:100%;}
  #page.is-empty:before{
    content:attr(data-placeholder);
    position:absolute;
    top:var(--page-pad, 56px);
    left:var(--page-pad, 56px);
    color:#a0a0a0;
    pointer-events:none;
  }

  /* Status bar */
  #statusbar{
    flex-shrink:0;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    padding:4px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  #zoomControl{
    display:flex;
    align-items:center;
    gap:4px;
  }
  #zoomControl button{
    background:rgba(255,255,255,0.18);
    border:none;
    color:#fff;
    width:18px; height:18px;
    border-radius:3px;
    font-size:12px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #zoomControl button:active{background:rgba(255,255,255,0.35);}
  #zoomLevel{min-width:32px; text-align:center;}

  /* File menu overlay */
  #fileMenu{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.35);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:50;
  }
  #fileMenu.open{display:flex;}
  #fileMenuBox{
    background:#fff;
    margin-top:54px;
    width:min(320px, 90vw);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .fileMenuItem{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    font-size:14px;
    border-bottom:1px solid #f0f0f0;
  }
  .fileMenuItem:active{background:#f5f5f5;}
  .fileMenuItem .ico{font-size:18px; width:20px; text-align:center;}
  #toast{
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    background:#323130; color:#fff; padding:9px 18px; border-radius:6px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:60; max-width:85vw; text-align:center;
  }
  #toast.show{opacity:1;}

  #fileInput{display:none;}

  /* Print preview modal */
  #previewOverlay{
    position:fixed; inset:0; background:#5a5a5a;
    display:none; flex-direction:column; z-index:80;
  }
  #previewOverlay.open{display:flex;}
  #previewTopbar{
    flex-shrink:0; background:var(--accent-dark); color:#fff;
    display:flex; align-items:center; gap:10px; padding:8px 12px;
  }
  #previewTitle{flex:1; font-size:14px; font-weight:600;}
  #previewBody{
    flex:1; overflow-y:auto; padding:20px 10px 40px;
  }
  .preview-page-label{
    text-align:center; color:#ddd; font-size:11px; margin:0 0 6px;
  }
  .preview-sheet{
    background:#fff;
    margin:0 auto 22px;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
    overflow:hidden;
    position:relative;
  }
  .preview-sheet-inner{
    position:absolute; top:0; left:0;
  }

  @media print{
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    html, body, #app{height:auto !important; overflow:visible !important; display:block !important;}
    #titlebar, #ribbon-tabs, #ribbon, #statusbar, #fileMenu, #toast, #previewTopbar, #rulerWrap, #vRulerWrap, #cornerBox{
      display:none !important;
    }
    #canvasWrap{ padding:0 !important; overflow:visible !important; }
    #canvasInner, #zoomStage{ width:auto !important; margin:0 !important; padding:0 !important; zoom:1 !important; }
    #docGrid{ display:block !important; }
    #page{
      box-shadow:none !important;
      width:auto !important;
      max-width:none !important;
      min-height:0 !important;
      margin:0 !important;
      padding:0 !important;
    }
    #page:before{ display:none !important; }
    #page tr{ break-inside:avoid; }
    #page p{ orphans:2; widows:2; }
    #previewOverlay{ display:none !important; }
    #pbLayer{ display:none !important; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="titlebar">
    <button class="titlebar-btn" id="menuBtn" title="Menu">&#9776;</button>
    <input id="docTitle" value="Dokumen Tanpa Judul" spellcheck="false">
    <button class="titlebar-btn" id="previewQuickBtn" title="Pratinjau Cetak">&#128065;&#65039;</button>
    <button class="titlebar-btn" id="saveBtn" title="Simpan">&#128190;</button>
  </div>

  <div id="ribbon-tabs">
    <div class="ribbon-tab active">Beranda</div>
    <div class="ribbon-tab" id="tabInsert">Sisipkan</div>
    <div class="ribbon-tab" id="tabLayout">Tata Letak</div>
  </div>

  <div id="ribbon">
    <div id="ribbonHome">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="undo" title="Urungkan">&#8630;</button>
          <button class="rbtn" data-cmd="redo" title="Ulangi">&#8631;</button>
        </span>
        <span class="ribbon-label">Urungkan</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <select class="rsel" id="fontFamily">
            <option value="Calibri, sans-serif">Calibri</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Verdana, sans-serif">Verdana</option>
          </select>
          <select class="rsel" id="fontSize">
            <option>8</option><option>9</option><option>10</option><option>11</option>
            <option selected>12</option><option>14</option><option>16</option><option>18</option>
            <option>20</option><option>24</option><option>28</option><option>32</option><option>36</option>
          </select>
        </span>
        <span class="ribbon-label">Font</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="bold" title="Tebal" style="font-weight:700;">B</button>
          <button class="rbtn" data-cmd="italic" title="Miring" style="font-style:italic;">I</button>
          <button class="rbtn" data-cmd="underline" title="Garis Bawah" style="text-decoration:underline;">U</button>
          <button class="rbtn" data-cmd="strikeThrough" title="Coret" style="text-decoration:line-through;">S</button>
        </span>
        <span class="ribbon-row" style="margin-top:2px;">
          <input type="color" class="colorpick" id="textColor" title="Warna Teks" value="#1a1a1a">
          <input type="color" class="colorpick" id="highlightColor" title="Sorot" value="#ffff00">
        </span>
        <span class="ribbon-label">Font</span>
      </span>

      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn" data-cmd="justifyLeft" title="Rata Kiri">&#8676;</button>
          <button class="rbtn" data-cmd="justifyCenter" title="Rata Tengah">&#8596;</button>
          <button class="rbtn" data-cmd="justifyRight" title="Rata Kanan">&#8677;</button>
          <button class="rbtn" data-cmd="justifyFull" title="Rata Kanan-Kiri">&#9776;</button>
        </span>
        <span class="ribbon-row" style="margin-top:2px;">
          <button class="rbtn" data-cmd="insertUnorderedList" title="Poin">&#8226;&#8226;&#8226;</button>
          <button class="rbtn" data-cmd="insertOrderedList" title="Penomoran">1.2.3.</button>
          <button class="rbtn" data-cmd="indent" title="Naikkan Indentasi">&#8677;&#8677;</button>
          <button class="rbtn" data-cmd="outdent" title="Turunkan Indentasi">&#8676;&#8676;</button>
        </span>
        <span class="ribbon-label">Paragraf</span>
      </span>
    </div>

    <div id="ribbonInsert" style="display:none;">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn wide" id="insertTableBtn">&#9638; Tabel</button>
          <button class="rbtn wide" id="insertLinkBtn">&#128279; Tautan</button>
          <button class="rbtn wide" id="insertHrBtn">&#8213; Garis</button>
        </span>
        <span class="ribbon-label">Sisipkan</span>
      </span>
    </div>

    <div id="ribbonLayout" style="display:none;">
      <span class="ribbon-group">
        <span class="ribbon-row">
          <select class="rsel" id="paperSize">
            <option value="A4" selected>A4 (21 x 29,7 cm)</option>
            <option value="Letter">Letter (21,6 x 27,9 cm)</option>
            <option value="Legal">Legal (21,6 x 35,6 cm)</option>
            <option value="F4">F4 / Folio (21,5 x 33 cm)</option>
          </select>
          <select class="rsel" id="orientation">
            <option value="portrait" selected>Potret</option>
            <option value="landscape">Lanskap</option>
          </select>
        </span>
        <span class="ribbon-label">Ukuran Kertas</span>
      </span>
      <span class="ribbon-group">
        <span class="ribbon-row">
          <select class="rsel" id="lineSpacing">
            <option value="1">1.0</option>
            <option value="1.15" selected>1.15</option>
            <option value="1.5">1.5</option>
            <option value="2">2.0</option>
          </select>
        </span>
        <span class="ribbon-label">Spasi Baris</span>
      </span>
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn wide" id="clearFormatBtn">Hapus Format</button>
        </span>
        <span class="ribbon-label">Format</span>
      </span>
      <span class="ribbon-group">
        <span class="ribbon-row">
          <button class="rbtn wide" id="printPreviewBtn">&#128065;&#65039; Pratinjau</button>
          <button class="rbtn wide" id="printBtn">&#128424;&#65039; Cetak</button>
        </span>
        <span class="ribbon-label">Cetak</span>
      </span>
    </div>
  </div>

  <div id="canvasWrap">
    <div id="canvasInner">
      <div id="zoomStage">
        <div id="docGrid">
          <div id="cornerBox"></div>
          <div id="rulerWrap"></div>
          <div id="vRulerWrap"><div id="vRulerInner"></div></div>
          <div id="pageCell">
            <div id="page" contenteditable="true" data-placeholder="Mulai menulis di sini..." spellcheck="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="wordCount">0 kata</span>
    <span id="zoomControl">
      <button id="zoomOutBtn" title="Perkecil">&#8722;</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomInBtn" title="Perbesar">+</button>
    </span>
    <span id="saveStatus">Belum disimpan</span>
  </div>
</div>

<div id="fileMenu">
  <div id="fileMenuBox">
    <div class="fileMenuItem" id="newDocItem"><span class="ico">&#128196;</span> Dokumen Baru</div>
    <div class="fileMenuItem" id="openDocItem"><span class="ico">&#128193;</span> Buka...</div>
    <div class="fileMenuItem" id="saveDocItem"><span class="ico">&#128190;</span> Simpan</div>
    <div class="fileMenuItem" id="exportTxtItem"><span class="ico">&#128441;&#65039;</span> Ekspor sebagai .txt</div>
  </div>
</div>

<div id="previewOverlay">
  <div id="previewTopbar">
    <button class="titlebar-btn" id="previewCloseBtn" title="Tutup">&#10005;</button>
    <span id="previewTitle">Pratinjau Cetak</span>
    <button class="titlebar-btn" id="previewPrintBtn" title="Cetak">&#128424;&#65039;</button>
  </div>
  <div id="previewBody"></div>
</div>

<input type="file" id="fileInput" accept=".doc,.html,.txt">
<div id="toast"></div>

<script>
(function(){
  const page = document.getElementById('page');
  const docTitle = document.getElementById('docTitle');
  const wordCount = document.getElementById('wordCount');
  const saveStatus = document.getElementById('saveStatus');
  const toastEl = document.getElementById('toast');
  const fileMenu = document.getElementById('fileMenu');
  const fileInput = document.getElementById('fileInput');

  const STORAGE_DIR = ''; // root of app's data dir
  let currentFileName = 'dokumen-tanpa-judul.doc';
  let dirty = false;

  // ---------- Paper size ----------
  const MM_TO_PX = 96 / 25.4;
  const MARGIN_MM = 25;
  const PAGE_GAP = 24;
  let rulerPages = 1;
  const PAPERS = {
    A4:     { w: 210,   h: 297   },
    Letter: { w: 215.9, h: 279.4 },
    Legal:  { w: 215.9, h: 355.6 },
    F4:     { w: 215,   h: 330   }
  };
  let currentPaper = 'A4';
  let currentOrientation = 'portrait';

  function getPaperDims(){
    const p = PAPERS[currentPaper] || PAPERS.A4;
    return currentOrientation === 'landscape'
      ? { w: p.h, h: p.w }
      : { w: p.w, h: p.h };
  }

  function applyPaperSize(){
    const dims = getPaperDims();
    const wPx = Math.round(dims.w * MM_TO_PX);
    const hPx = Math.round(dims.h * MM_TO_PX);
    const marginPx = Math.round(MARGIN_MM * MM_TO_PX);
    page.style.maxWidth = wPx + 'px';
    page.style.width = wPx + 'px';
    page.style.minHeight = hPx + 'px';
    page.style.padding = marginPx + 'px';
    page.style.setProperty('--page-pad', marginPx + 'px');

    let styleTag = document.getElementById('pagesizeStyle');
    if(!styleTag){
      styleTag = document.createElement('style');
      styleTag.id = 'pagesizeStyle';
      document.head.appendChild(styleTag);
    }
    styleTag.textContent = '@page{ size:' + dims.w + 'mm ' + dims.h + 'mm; margin:' + MARGIN_MM + 'mm; }';

    buildRuler(wPx, marginPx);
    buildVRuler(hPx, marginPx);
  }

  // ---------- Ruler ----------
  const PX_PER_CM = MM_TO_PX * 10;
  function buildRuler(wPx, marginPx){
    const rulerWrap = document.getElementById('rulerWrap');
    rulerWrap.style.width = wPx + 'px';
    rulerWrap.innerHTML = '';

    const leftMargin = document.createElement('div');
    leftMargin.className = 'ruler-margin';
    leftMargin.style.left = '0';
    leftMargin.style.width = marginPx + 'px';
    rulerWrap.appendChild(leftMargin);

    const rightMargin = document.createElement('div');
    rightMargin.className = 'ruler-margin';
    rightMargin.style.right = '0';
    rightMargin.style.width = marginPx + 'px';
    rulerWrap.appendChild(rightMargin);

    // Ticks span the whole page width; numbering restarts at 0 from the
    // left margin (matching Word's ruler), counting up in cm.
    const totalCm = wPx / PX_PER_CM;
    const startCm = -Math.floor(marginPx / PX_PER_CM) - 1;
    const endCm = Math.ceil((wPx - marginPx) / PX_PER_CM) + 1;
    for(let cm = startCm; cm <= endCm; cm++){
      const x = marginPx + cm * PX_PER_CM;
      if(x < 0 || x > wPx) continue;

      const major = document.createElement('div');
      major.className = 'ruler-tick major';
      major.style.left = x + 'px';
      rulerWrap.appendChild(major);

      if(cm !== 0){
        const num = document.createElement('div');
        num.className = 'ruler-num';
        num.style.left = x + 'px';
        num.textContent = Math.abs(cm);
        rulerWrap.appendChild(num);
      }

      if(cm < endCm){
        const half = document.createElement('div');
        half.className = 'ruler-tick minor';
        half.style.left = (x + PX_PER_CM/2) + 'px';
        rulerWrap.appendChild(half);
      }
    }
  }

  function buildVRuler(hPx, marginPx){
    const vRulerWrap = document.getElementById('vRulerInner');
    const pages = 1; // satu penggaris diam, skala satu halaman
    vRulerWrap.style.height = (pages * hPx + (pages - 1) * PAGE_GAP) + 'px';
    vRulerWrap.innerHTML = '';
    const add = (cls, prop, val, extra)=>{
      const d = document.createElement('div');
      d.className = cls; d.style[prop] = val + 'px';
      if(extra) Object.assign(d.style, extra);
      vRulerWrap.appendChild(d); return d;
    };
    const startCm = -Math.floor(marginPx / PX_PER_CM) - 1;
    const endCm = Math.ceil((hPx - marginPx) / PX_PER_CM) + 1;
    for(let k = 0; k < pages; k++){
      const off = k * (hPx + PAGE_GAP);
      add('ruler-margin-v', 'top', off, {height: marginPx + 'px'});
      add('ruler-margin-v', 'top', off + hPx - marginPx, {height: marginPx + 'px'});
      if(k < pages - 1) add('ruler-gap-v', 'top', off + hPx, {height: PAGE_GAP + 'px'});
      for(let cm = startCm; cm <= endCm; cm++){
        const y = marginPx + cm * PX_PER_CM;
        if(y < 0 || y > hPx) continue;
        add('ruler-tick-v major', 'top', off + y);
        if(cm !== 0){
          const num = add('ruler-num-v', 'top', off + y);
          num.textContent = Math.abs(cm);
        }
        if(cm < endCm && y + PX_PER_CM / 2 <= hPx) add('ruler-tick-v minor', 'top', off + y + PX_PER_CM / 2);
      }
    }
    syncVRuler();
  }

  // Penggaris samping: satu kotak tetap di layar (sticky), isinya digeser

  var curZoom = 1;
  function syncVRuler(){
    const wrap = document.getElementById('vRulerWrap');
    const inner = document.getElementById('vRulerInner');
    const cw = document.getElementById('canvasWrap');
    if(!wrap || !inner || !cw) return;
    const z = curZoom || 1;
    // tinggi kotak = tinggi area gulir dikurangi penggaris atas (satuan CSS di dalam zoom)
    wrap.style.height = Math.max(0, cw.clientHeight / z - 22) + 'px';
    // skala tidak ikut bergeser saat menggulir: hanya kertas yang bergulir

  // ---------- Pembersihan HTML (buka file, tempel, pulihkan cadangan) ----------
  const UNSAFE_TAGS = 'script, style, iframe, object, embed, link, meta, base, form, input, button, textarea, select, frame, frameset, applet, noscript, template, svg, math, audio, video, source, title';
  function sanitizeHTML(html){
    const doc = new DOMParser().parseFromString(String(html), 'text/html');
    doc.querySelectorAll(UNSAFE_TAGS).forEach(n => n.remove());
    doc.body.querySelectorAll('*').forEach(el=>{
      Array.from(el.attributes).forEach(attr=>{
        const name = attr.name.toLowerCase();
        const val = attr.value.replace(/[\u0000- ]/g, '').toLowerCase();
        if(name.indexOf('on') === 0 || name === 'srcdoc' || name === 'formaction' || name === 'id' || name === 'class'){
          el.removeAttribute(attr.name);
        } else if((name === 'href' || name === 'src' || name === 'xlink:href') && /^(javascript:|vbscript:|data:text\/html)/.test(val)){
          el.removeAttribute(attr.name);
        } else if(name === 'style' && /expression\(|javascript:|@import|behavior:/.test(val)){
          el.removeAttribute(attr.name);
        }
      });
    });
    return doc.body.innerHTML;
  }
  function escapeHTML(s){
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function textToHTML(text){
    return String(text).replace(/\r\n?/g, '\n').split('\n')
      .map(line => line.trim() ? '<p>' + escapeHTML(line) + '</p>' : '<p><br></p>')
      .join('');
  }

  // Bungkus teks/elemen inline yang berdiri sendiri ke dalam <p> agar bisa dipotong per blok
  function wrapLooseNodes(container){
    const INLINE = /^(A|B|I|U|S|EM|STRONG|SPAN|FONT|SUB|SUP|SMALL|BIG|STRIKE|CODE|MARK|BR|IMG)$/;
    let run = null;
    Array.from(container.childNodes).forEach(node=>{
      const isInline = node.nodeType === 3 || (node.nodeType === 1 && INLINE.test(node.nodeName));
      if(!isInline){ run = null; return; }
      if(!run){
        if(node.nodeType === 3 && !node.nodeValue.trim()) return;
        run = document.createElement('p');
        container.insertBefore(run, node);
      }
      run.appendChild(node);
    });

  // Titik awal tiap halaman: pindah ke halaman baru di batas blok, bukan memotong di tengah blok
  function computePageBreaks(measurer, contentH){
    const starts = [0];
    let pageStart = 0;
    Array.from(measurer.children).forEach(el=>{
      const top = el.offsetTop;
      const bottom = top + el.offsetHeight;
      if(bottom - pageStart > contentH && top > pageStart){
        pageStart = top;
        starts.push(pageStart);
      }
      // blok yang lebih tinggi dari satu halaman dipotong per tinggi halaman
      while(bottom - pageStart > contentH){
        pageStart += contentH;
        starts.push(pageStart);
      }
    });
    return starts;
  }

  function buildPreview(){
    previewBody.innerHTML = '';
    const dims = getPaperDims();
    const wPx = Math.round(dims.w * MM_TO_PX);
    const hPx = Math.round(dims.h * MM_TO_PX);
    const marginPx = Math.round(MARGIN_MM * MM_TO_PX);
    const contentW = wPx - 2 * marginPx;
    const contentH = hPx - 2 * marginPx;
    const lineHeight = page.style.lineHeight || '1.6';

    // Ukur isi dokumen di area tak terlihat dengan lebar area tulis yang sebenarnya
    const measurer = document.createElement('div');
    measurer.className = 'doc-content';
    measurer.style.cssText = 'position:absolute; visibility:hidden; pointer-events:none; top:-99999px; left:-99999px;' +
      'width:' + contentW + 'px; line-height:' + lineHeight + ';';
    measurer.innerHTML = docHTML();
    wrapLooseNodes(measurer);
    document.body.appendChild(measurer);
    const starts = computePageBreaks(measurer, contentH);
    const totalHeight = measurer.offsetHeight;
    const normalizedHTML = measurer.innerHTML;
    document.body.removeChild(measurer);

    // Kecilkan lembar agar muat di lebar layar HP
    const avail = previewBody.clientWidth - 20;
    const scale = (avail > 0) ? Math.min(1, avail / wPx) : 1;

    for(let i = 0; i < starts.length; i++){
      const start = starts[i];
      const end = (i + 1 < starts.length) ? starts[i + 1] : totalHeight;
      const sliceH = Math.max(1, Math.min(contentH, end - start));

      const label = document.createElement('div');
      label.className = 'preview-page-label';
      label.textContent = 'Halaman ' + (i + 1) + ' dari ' + starts.length + ' · ' + currentPaper + (currentOrientation === 'landscape' ? ' (Lanskap)' : '');
      previewBody.appendChild(label);

      const sheet = document.createElement('div');
      sheet.className = 'preview-sheet';
      // Lembar diperkecil dengan transform (bukan zoom) agar tata letak teks tetap 1:1
      // dan titik potong halaman tidak bergeser
      sheet.style.width = Math.round(wPx * scale) + 'px';
      sheet.style.height = Math.round(hPx * scale) + 'px';

      const scaler = document.createElement('div');
      scaler.style.cssText = 'position:absolute; top:0; left:0; width:' + wPx + 'px; height:' + hPx + 'px;' +
        'transform-origin:0 0; transform:scale(' + scale + ');';

      const win = document.createElement('div');
      win.style.cssText = 'position:absolute; overflow:hidden; left:' + marginPx + 'px; top:' + marginPx + 'px;' +
        'width:' + contentW + 'px; height:' + sliceH + 'px;';

      const inner = document.createElement('div');
      inner.className = 'doc-content preview-sheet-inner';
      inner.style.width = contentW + 'px';
      inner.style.lineHeight = lineHeight;
      inner.style.top = (-start) + 'px';
      inner.innerHTML = normalizedHTML;

      win.appendChild(inner);
      scaler.appendChild(win);
      sheet.appendChild(scaler);
      previewBody.appendChild(sheet);
    }
  }

  // ---------- Penanda batas halaman di editor ----------
  const pbLayer = document.createElement('div');

  const LEAF = /^(P|DIV|H[1-6]|LI|BLOCKQUOTE|PRE)$/;

  function stripMarks(root){
    root.querySelectorAll('.pgsp').forEach(sp=>{ const p = sp.parentNode; sp.remove(); if(p === page) p.normalize(); else p.normalize(); });
    root.querySelectorAll('[data-pgm]').forEach(e=>{
      e.removeAttribute('data-pgm'); e.style.removeProperty('--pgm');
      if(!e.getAttribute('style')) e.removeAttribute('style');
    });
  }
  function docHTML(){
    const c = page.cloneNode(true);
    c.querySelectorAll('.pgsp').forEach(sp=>sp.remove());
    c.querySelectorAll('[data-pgm]').forEach(e=>{
      e.removeAttribute('data-pgm'); e.style.removeProperty('--pgm');
      if(!e.getAttribute('style')) e.removeAttribute('style');
    });
    return c.innerHTML;
  }

  function collectBlocks(parent, out){
    Array.from(parent.children).forEach(el=>{
      if(el.classList.contains('pgsp')) return;
      if(/^(UL|OL|BLOCKQUOTE|DIV|LI)$/.test(el.tagName) && el.querySelector('p,div,li,h1,h2,h3,h4,h5,h6,table')) collectBlocks(el, out);
      else out.push(el);
    });
    return out;
  }

  // Indeks karakter pertama di dalam el yang bagian bawahnya melewati batas (koordinat layar)
  function firstCharBelow(el, limitY){
    const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const rg = document.createRange();
    const bottomAt = (n,i)=>{ rg.setStart(n,i); rg.setEnd(n,i+1); const r = rg.getBoundingClientRect(); return r.height ? r.bottom : -1; };
    let n;
    while((n = tw.nextNode())){
      const len = n.nodeValue.length;
      if(!len) continue;
      let lo = 0, hi = len; // cari indeks terkecil dengan bottom > limit
      while(lo < hi){
        const mid = (lo + hi) >> 1;
        let k = mid, v = bottomAt(n,k);
        while(v < 0 && k < len - 1){ k++; v = bottomAt(n,k); }
        if(v > limitY) hi = mid; else lo = mid + 1;
      }
      if(lo < len && bottomAt(n, lo) > limitY) return {node:n, index:lo};
    }
    return null;
  }

  function updatePageBreaks(){
    const dims = getPaperDims();
    const wPx = Math.round(dims.w * MM_TO_PX);
    const hPx = Math.round(dims.h * MM_TO_PX);
    const marginPx = Math.round(MARGIN_MM * MM_TO_PX);
    const contentH = hPx - 2 * marginPx;
    const dead = 2 * marginPx + PAGE_GAP;   // margin bawah + celah + margin atas
    const pitch = contentH + dead;

    const z = zoomStage.style.zoom, sl = canvasWrap.scrollLeft, st = canvasWrap.scrollTop;
    zoomStage.style.zoom = 1; // ukur pada skala 1:1
    stripMarks(page);
    page.style.minHeight = '0px';

    const origin = page.getBoundingClientRect().top + marginPx;
    const rel = y => y - origin;
    let limit = contentH, guard = 0;

    collectBlocks(page, []).forEach(el=>{
      const leaf = LEAF.test(el.tagName);
      for(;;){
        if(++guard > 3000) return;
        const r = el.getBoundingClientRect();
        const top = rel(r.top), bottom = rel(r.bottom);
        if(top >= limit + dead - 1){ limit += pitch; continue; }
        const push = ()=>{
          const cur = parseFloat(el.style.getPropertyValue('--pgm')) || 0;
          el.setAttribute('data-pgm', '1');
          el.style.setProperty('--pgm', (cur + limit + dead - top) + 'px');
        };
        if(top >= limit){ push(); limit += pitch; continue; }
        if(bottom <= limit + 0.5) break;
        // blok melewati batas halaman
        const pageTop = limit - contentH;
        const firstOnPage = top <= pageTop + 1;
        if(!leaf){ if(firstOnPage) break; push(); limit += pitch; continue; }
        const hit = firstCharBelow(el, origin + limit);
        if(!hit){ if(firstOnPage) break; push(); limit += pitch; continue; }
        const rg = document.createRange();
        rg.setStart(hit.node, hit.index); rg.setEnd(hit.node, Math.min(hit.node.nodeValue.length, hit.index + 1));
        const cr = rg.getBoundingClientRect();
        const lh = parseFloat(getComputedStyle(el).lineHeight) || cr.height * 1.6;
        if(rel(cr.top) - top < lh * 0.9){ // baris pertama blok: pindahkan seluruh blok
          if(firstOnPage) break;
          push(); limit += pitch; continue;
        }
        // baris di tengah paragraf: sisipkan spacer agar baris itu turun ke halaman berikutnya
        const sp = document.createElement('span');
        sp.className = 'pgsp';
        sp.setAttribute('contenteditable', 'false');
        sp.style.height = Math.max(lh, lh + (limit + dead - rel(cr.top))) + 'px';
        rg.collapse(true);
        rg.insertNode(sp);
        limit += pitch;
      }
    });

    const pages = Math.max(1, Math.round((limit - contentH) / pitch) + 1);
    pbLayer.innerHTML = '';
    for(let k = 1; k < pages; k++){
      const gap = document.createElement('div');
      gap.className = 'pb-gap';
      gap.style.top = (k * hPx + (k - 1) * PAGE_GAP) + 'px';
      gap.style.height = PAGE_GAP + 'px';
      const tag = document.createElement('span');
      tag.textContent = 'Halaman ' + (k + 1);
      gap.appendChild(tag);
      pbLayer.appendChild(gap);
    }
    page.style.minHeight = (pages * hPx + (pages - 1) * PAGE_GAP) + 'px';
    rulerPages = pages;
    zoomStage.style.zoom = z;
    canvasWrap.scrollLeft = sl; canvasWrap.scrollTop = st;
    syncVRuler();
  }
  function schedulePageBreaks(){
    clearTimeout(pbTimer);
    pbTimer = setTimeout(updatePageBreaks, 250);

  // ---------- Ribbon tabs ----------

  const panels = {
    0: document.getElementById('ribbonHome'),
    1: document.getElementById('ribbonInsert'),
    2: document.getElementById('ribbonLayout')
  };
  tabs.forEach((tab, idx)=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(panels).forEach(p=>p.style.display='none');
      panels[idx].style.display='block';
    });
  });

  // ---------- File menu ----------
  document.getElementById('menuBtn').addEventListener('click', ()=> fileMenu.classList.add('open'));
  fileMenu.addEventListener('click', (e)=>{ if(e.target===fileMenu) fileMenu.classList.remove('open'); });

  document.getElementById('newDocItem').addEventListener('click', ()=>{
    fileMenu.classList.remove('open');
    if(dirty && !confirm('Dokumen belum disimpan. Buat dokumen baru dan buang perubahan?')) return;
    page.innerHTML = '';
    savedRange = null;
    ensureParagraph();
    docTitle.value = 'Dokumen Tanpa Judul';
    currentFileName = 'dokumen-tanpa-judul.doc';
    dirty = false;
    saveStatus.textContent = 'Belum disimpan';
    updateWordCount();
    schedulePageBreaks();
    saveBackupNow();
  });

  document.getElementById('saveDocItem').addEventListener('click', ()=>{ fileMenu.classList.remove('open'); saveDocument(); });
  document.getElementById('saveBtn').addEventListener('click', saveDocument);

  document.getElementById('exportTxtItem').addEventListener('click', async ()=>{
    fileMenu.classList.remove('open');
    const text = page.innerText;
    const name = (docTitle.value || 'dokumen').replace(/[\\/:*?"<>|]/g,'_') + '.txt';
    if(isCapacitor()){
      try{
        await window.Capacitor.Plugins.Filesystem.writeFile({
          path: name, data: text,
          directory: 'DOCUMENTS', encoding: 'utf8'
        });
        toast('Diekspor ke Documents: ' + name);
      }catch(err){ toast('Gagal ekspor: ' + err.message); }
    } else {
      downloadBlob(new Blob([text], {type:'text/plain'}), name);
    }
  });

  document.getElementById('openDocItem').addEventListener('click', ()=>{
    fileMenu.classList.remove('open');
    if(isCapacitor()){
      openFromAppStorage();
    } else {
      fileInput.click();
    }
  });

  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      loadContent(reader.result, f.name);
    };
    reader.readAsText(f);
    fileInput.value = '';
  });

  function loadContent(content, name){
    // .txt adalah teks biasa; format lain diperlakukan sebagai HTML dan dibersihkan dulu
    page.innerHTML = /\.txt$/i.test(name) ? textToHTML(content) : sanitizeHTML(content);
    savedRange = null;
    ensureParagraph();
    docTitle.value = name.replace(/\.(doc|html|txt)$/i, '');
    currentFileName = name;
    dirty = false;
    saveStatus.textContent = 'Tersimpan';
    updateWordCount();
    schedulePageBreaks();
    saveBackupNow();
  }

  async function saveDocument(){
    const name = (docTitle.value || 'dokumen').trim().replace(/[\\/:*?"<>|]/g,'_') + '.doc';
    currentFileName = name;
    const content = docHTML();
    if(isCapacitor()){
      try{
        await window.Capacitor.Plugins.Filesystem.writeFile({
          path: name, data: content,
          directory: 'DOCUMENTS', encoding: 'utf8'
        });
        dirty = false;
        saveStatus.textContent = 'Tersimpan';
        toast('Dokumen disimpan: ' + name);
      }catch(err){
        toast('Gagal menyimpan: ' + err.message);
        return;
      }
      // Pilih lokasi/tujuan lewat menu bagikan Android (Files, Drive, dll.)
      const Share = window.Capacitor.Plugins.Share;
      if(Share){
        try{
          const html = '<html><head><meta charset="utf-8"></head><body>' + content + '</body></html>';
          const tmp = await window.Capacitor.Plugins.Filesystem.writeFile({
            path: name, data: html,
            directory: 'CACHE', encoding: 'utf8'
          });
          await Share.share({ title: name, url: tmp.uri, dialogTitle: 'Simpan ke...' });
        }catch(err){
          // Menutup menu bagikan dianggap batal, bukan kesalahan
          if(!/cancel/i.test(String(err && err.message))) toast('Gagal membuka menu simpan: ' + err.message);
        }
      }
    } else {
      // Browser fallback: local download as .doc (Word-openable HTML)
      const html = '<html><head><meta charset="utf-8"></head><body>' + content + '</body></html>';
      downloadBlob(new Blob([html], {type:'application/msword'}), name);
      dirty = false;
      saveStatus.textContent = 'Tersimpan (diunduh)';
    }
  }

  async function openFromAppStorage(){
    try{
      const res = await window.Capacitor.Plugins.Filesystem.readdir({
        path: '', directory: 'DOCUMENTS'
      });
      const docs = (res.files || []).filter(f=>{
        const n = f.name || f;
        return /\.(doc|html|txt)$/i.test(n);
      });
      if(!docs.length){ toast('Belum ada dokumen tersimpan'); return; }
      const names = docs.map(f=> f.name || f);
      const choice = prompt('Buka dokumen:\n' + names.map((n,i)=>(i+1)+'. '+n).join('\n') + '\n\nMasukkan nomor:');
      const idx = parseInt(choice) - 1;
      if(!(idx >= 0 && idx < names.length)) return;
      const fileRes = await window.Capacitor.Plugins.Filesystem.readFile({
        path: names[idx], directory: 'DOCUMENTS', encoding: 'utf8'
      });
      loadContent(fileRes.data, names[idx]);
      toast('Dibuka: ' + names[idx]);
    }catch(err){
      toast('Gagal membuka: ' + err.message);
    }
  }

  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  docTitle.addEventListener('input', ()=>{ markDirty(); scheduleAutoSave(); });

  // ---------- Auto-save to localStorage as backup ----------
  const AUTOSAVE_KEY = 'wordapp_autosave';
  let autoSaveTimer = null;
  let autoSavePending = false;
  let autoSaveWarned = false;

  function autoSave(){
    autoSavePending = false;
    try{
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
        title: docTitle.value,
        content: docHTML(),
        paper: currentPaper,
        orientation: currentOrientation,
        lineHeight: page.style.lineHeight || '',
        ts: Date.now()
      }));
    }catch(e){
      if(!autoSaveWarned){
        autoSaveWarned = true;
        toast('Cadangan otomatis gagal (penyimpanan penuh)');
      }
    }
  }
  // Simpan hanya setelah ada perubahan, tunggu jeda mengetik
  function scheduleAutoSave(){
    autoSavePending = true;
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(autoSave, 1500);
  }
  function flushAutoSave(){
    clearTimeout(autoSaveTimer);
    if(autoSavePending) autoSave();
  }
  function saveBackupNow(){
    autoSavePending = true;
    flushAutoSave();
  }
  // Aplikasi dipindah ke latar belakang atau ditutup: simpan segera
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushAutoSave(); });
  window.addEventListener('pagehide', flushAutoSave);

  function setSelectValue(id, value){
    const sel = document.getElementById(id);
    if(Array.from(sel.options).some(o => o.value === String(value))) sel.value = String(value);
  }

  // Spasi baris bawaan mengikuti pilihan di menu (sebelumnya menu 1.15 tapi halaman 1.6)
  page.style.lineHeight = document.getElementById('lineSpacing').value;

  function restoreAutoSave(){
    try{
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      if(data.paper && PAPERS[data.paper]){
        currentPaper = data.paper;
        setSelectValue('paperSize', currentPaper);
      }
      if(data.orientation === 'landscape' || data.orientation === 'portrait'){
        currentOrientation = data.orientation;
        setSelectValue('orientation', currentOrientation);
      }
      applyPaperSize();
      if(data.lineHeight){
        page.style.lineHeight = data.lineHeight;
        setSelectValue('lineSpacing', data.lineHeight);
      }
      if(data.content && data.content.trim()){
        page.innerHTML = sanitizeHTML(data.content);
        docTitle.value = data.title || docTitle.value;
      }
    }catch(e){}
  }
  restoreAutoSave();
  ensureParagraph();
  updateWordCount();

  // Prevent accidental navigation loss
  window.addEventListener('beforeunload', (e)=>{
    if(dirty){ e.preventDefault(); e.returnValue=''; }
  });

  // ---------- Zoom (pinch-to-zoom + status bar controls) ----------
  const zoomStage = document.getElementById('zoomStage');
  const zoomLevelEl = document.getElementById('zoomLevel');
  const canvasWrap = document.getElementById('canvasWrap');
  const ZOOM_MIN = 0.5, ZOOM_MAX = 3;
  let zoom = 1;

  function applyZoom(z, focus){
    z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    // Keep the point under the pinch/focus roughly stationary while scaling.
    let ratio = 1;
    if(zoom) ratio = z / zoom;
    zoom = z;
    curZoom = z;
    zoomStage.style.zoom = zoom; // Chromium/Android WebView: real layout rescale
    zoomLevelEl.textContent = Math.round(zoom * 100) + '%';
    if(focus && ratio !== 1){
      canvasWrap.scrollLeft = (canvasWrap.scrollLeft + focus.x) * ratio - focus.x;
      canvasWrap.scrollTop = (canvasWrap.scrollTop + focus.y) * ratio - focus.y;
    }
    syncVRuler();
  }

  document.getElementById('zoomInBtn').addEventListener('click', ()=> applyZoom(zoom + 0.1));
  document.getElementById('zoomOutBtn').addEventListener('click', ()=> applyZoom(zoom - 0.1));

  // Two-finger pinch
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  function touchDist(t0, t1){
    const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  canvasWrap.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartZoom = zoom;
    }
  }, {passive:true});
  canvasWrap.addEventListener('touchmove', (e)=>{
    if(e.touches.length === 2 && pinchStartDist){
      e.preventDefault();
      const dist = touchDist(e.touches[0], e.touches[1]);
      const rect = canvasWrap.getBoundingClientRect();
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      applyZoom(pinchStartZoom * (dist / pinchStartDist), {x: midX, y: midY});
    }
  }, {passive:false});
  canvasWrap.addEventListener('touchend', (e)=>{
    if(e.touches.length < 2) pinchStartDist = null;
  });

  // Desktop convenience: Ctrl/Cmd + wheel to zoom
  canvasWrap.addEventListener('wheel', (e)=>{
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      const rect = canvasWrap.getBoundingClientRect();
      applyZoom(zoom - e.deltaY * 0.001, {x: e.clientX - rect.left, y: e.clientY - rect.top});
    }
  }, {passive:false});

  // Sinkronkan penggaris samping saat menggulir / ukuran layar berubah
  let vrTick = false;
  canvasWrap.addEventListener('scroll', ()=>{
    if(vrTick) return;
    vrTick = true;
    requestAnimationFrame(()=>{ vrTick = false; syncVRuler(); });
  }, {passive:true});
  window.addEventListener('resize', syncVRuler);

  syncVRuler();
  updateWordCount();
  schedulePageBreaks();
})();
</script>
</body>
</html>
