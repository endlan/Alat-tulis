name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Copy native plugin JS into www (for Filesystem)
        run: |
          mkdir -p www/capacitor-plugins
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/capacitor-plugins/filesystem.js
          ls -la www/capacitor-plugins
      - name: Ensure persistent debug keystore exists (generate once, reuse forever)
        run: |
          mkdir -p ci-keystore
          if [ ! -f ci-keystore/debug.keystore ]; then
            echo "Belum ada keystore, generate baru..."
            keytool -genkeypair -v \
              -keystore ci-keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ci-keystore/debug.keystore
            git commit -m "chore: generate persistent debug keystore [skip ci]"
            git push
          else
            echo "Keystore sudah ada di repo, dipakai ulang (sertifikat tetap sama)."
          fi
      - name: Add or sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Generate app icon from resources/icon.png
        run: |
          if [ -f "resources/icon.png" ]; then
            npx @capacitor/assets generate --android
          else
            echo "Lewati: resources/icon.png belum ada, pakai ikon default Capacitor."
          fi
      - name: Put debug keystore in place
        run: cp ci-keystore/debug.keystore android/app/debug.keystore
      - name: Force explicit debug signing config
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF
          cat android/app/build.gradle
      - name: Print keystore fingerprint (debug check)
        run: keytool -list -v -keystore ci-keystore/debug.keystore -storepass android -alias androiddebugkey | grep SHA1
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Print ACTUAL APK signing certificate (real check)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA1
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tulis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
