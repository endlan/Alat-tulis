name: Generate Debug Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate persistent debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Show base64 (copy this into secret DEBUG_KEYSTORE_BASE64)
        run: |
          base64 -w0 debug.keystore > debug-keystore-base64.txt
          echo "## Base64 keystore — copy semua teks di dalam kotak ini" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat debug-keystore-base64.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
      - name: Upload base64 text artifact (easiest to open/copy on mobile)
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-base64
          path: debug-keystore-base64.txt
