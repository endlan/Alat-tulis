name: Generate Debug Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate persistent debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Show base64 (copy this into secret DEBUG_KEYSTORE_BASE64)
        run: base64 -w0 debug.keystore
      - name: Upload as artifact too
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
